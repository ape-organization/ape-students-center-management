name: Auto Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Calculate new tag
        id: new_tag
        run: |
          latest=${{ steps.get_tag.outputs.latest }}
          echo "Latest tag: $latest"

          IFS='.' read -r major minor patch <<< "$latest"

          # اقرأ version من commit message (لو موجود)
          target=$(git log -1 --pretty=%B | grep -oE '[0-9]+\.[0-9]+' || true)

          if [[ -z "$target" ]]; then
            # نفس version → زود patch
            patch=$((patch + 1))
            new_tag="$major.$minor.$patch"
          else
            IFS='.' read -r t_major t_minor <<< "$target"

            if [[ "$major" == "$t_major" && "$minor" == "$t_minor" ]]; then
              patch=$((patch + 1))
              new_tag="$major.$minor.$patch"
            else
              new_tag="$t_major.$t_minor.0"
            fi
          fi

          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
          echo "New tag: $new_tag"

      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag ${{ steps.new_tag.outputs.new_tag }}
          git push origin ${{ steps.new_tag.outputs.new_tag }}
