# Server/Production Configuration - Uses SQL Server Database
# This is the default configuration when spring.profiles.active is not set to 'local'

# SQL Server Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA Configuration for SQL Server
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# H2 Console (disabled in production)
spring.h2.console.enabled=false

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationInStudentCenterApplicationSecurityModule}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Security logging (reduced in production)
logging.level.org.springframework.security=WARN

