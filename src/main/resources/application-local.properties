# Local Development Configuration - Uses H2 In-Memory Database
# This profile is automatically activated when no spring.profiles.active is set
# H2 Database Configuration
spring.datasource.url=${DATABASE_HOST_SERVER:jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_NAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080

# JWT Configuration (local defaults)
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationInStudentCenterApplicationSecurityModule
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# Security debug logging
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.FilterChainProxy=TRACE

# Swagger UI Configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.urls[0].name=API Documentation
springdoc.swagger-ui.urls[0].url=/api-docs

# Server servlet context path (base path for API)
server.servlet.context-path=/api

